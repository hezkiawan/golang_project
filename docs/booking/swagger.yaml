basePath: /
definitions:
  booking.AdminBooking:
    properties:
      booking_date:
        type: string
      id:
        type: integer
      service_id:
        type: integer
      service_name:
        type: string
      status:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  booking.AdminBookingPage:
    properties:
      data:
        items:
          $ref: '#/definitions/booking.AdminBooking'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  booking.AvailabilityResponse:
    properties:
      booked_service_ids:
        items:
          type: integer
        type: array
    type: object
  booking.Booking:
    properties:
      booking_date:
        description: '"2026-11-05" date dijadiin string dari postgres'
        type: string
      created_at:
        type: string
      id:
        type: integer
      service_id:
        type: integer
      service_name:
        description: |-
          only filled by GetMyBookingsPage (JOIN on services), so a deleted service still shows its name.
          omitempty: other responses (create, confirm, cancel) just leave it out
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  booking.BookingDetail:
    properties:
      booking_date:
        type: string
      created_at:
        type: string
      id:
        type: integer
      service_id:
        type: integer
      service_name:
        type: string
      status:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  booking.BookingRequest:
    properties:
      booking_date:
        description: client sends "YYYY-MM-DD"
        type: string
      service_id:
        type: integer
    type: object
  booking.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  booking.MyBookingPage:
    properties:
      data:
        items:
          $ref: '#/definitions/booking.Booking'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
host: localhost:3001
info:
  contact: {}
  description: |-
    Bookings: create, detail, approve/reject (admin), cancel (owner), availability, My Bookings and the admin bookings table.
    Auth: log in at POST /auth/login (user service, port 3003). The browser then sends the jwt cookie automatically.
    Every route needs that cookie (no cookie → 401). Routes marked "admin only" give 403 to normal users.
  title: HomeFix Booking Service API
  version: "1.0"
paths:
  /bookings:
    get:
      description: 'Auth: admin only. One page of bookings with user and service names.
        All filters combine with AND.'
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Rows per page (max 100)
        in: query
        name: limit
        type: integer
      - description: Sort column
        enum:
        - booking_date
        - status
        - created_at
        - username
        - service_name
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Comma-separated statuses (pending, confirmed, cancelled, rejected),
          e.g. pending,confirmed
        in: query
        name: status
        type: string
      - description: Only this date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: Search in the user's name
        in: query
        name: username
        type: string
      - description: Search in the service's name
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.AdminBookingPage'
        "400":
          description: date is not YYYY-MM-DD
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "403":
          description: not an admin
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: List all bookings (admin table)
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: 'Auth: login required (normal users only). Creates a pending booking.
        One service can have only one active booking per date. Admins cannot book.'
      parameters:
      - description: Service and date
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/booking.BookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: service id empty or wrong, service does not exist, or date
            not YYYY-MM-DD / in the past
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "403":
          description: admins cannot create bookings
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "409":
          description: already booked on that date
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: database error or event publish failed
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "503":
          description: catalog service unavailable
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: Book a service for a date
      tags:
      - bookings
  /bookings/{id}:
    get:
      description: 'Auth: login required. A booking with the user''s and service''s
        names. Admins can see any booking; a user only their own (otherwise 404, so
        we don''t reveal that it exists).'
      parameters:
      - description: Booking id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.BookingDetail'
        "400":
          description: invalid booking id
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "404":
          description: not found (or not yours)
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: One booking (detail page)
      tags:
      - bookings
  /bookings/{id}/cancel:
    post:
      description: 'Auth: login required. pending → cancelled. Only the owner, and
        only while pending. Confirmed, rejected or someone else''s booking gives 409.'
      parameters:
      - description: Booking id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: invalid booking id
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "409":
          description: not found, not yours, or not pending
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: Cancel my booking
      tags:
      - bookings
  /bookings/{id}/confirm:
    post:
      description: 'Auth: admin only. pending → confirmed, for any user''s booking.
        Any other status gives 409.'
      parameters:
      - description: Booking id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: invalid booking id
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "403":
          description: not an admin
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "409":
          description: not found or not pending
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: Approve a booking (admin)
      tags:
      - bookings
  /bookings/{id}/reject:
    post:
      description: 'Auth: admin only. pending → rejected. Any other status gives 409.
        A rejected booking frees the date.'
      parameters:
      - description: Booking id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: invalid booking id
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "403":
          description: not an admin
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "409":
          description: not found or not pending
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: Reject a booking (admin)
      tags:
      - bookings
  /bookings/availability:
    get:
      description: 'Auth: login required. Ids of the services that already have a
        pending or confirmed booking on that date, so the booking form can disable
        them.'
      parameters:
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.AvailabilityResponse'
        "400":
          description: date is not YYYY-MM-DD
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: Which services are taken on a date
      tags:
      - bookings
  /bookings/me:
    get:
      description: 'Auth: login required. One page of the logged-in user''s bookings,
        with the service name. Default order: booking date, newest first.'
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Rows per page (max 100)
        in: query
        name: limit
        type: integer
      - description: Sort column
        enum:
        - booking_date
        - service_name
        - status
        - created_at
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Comma-separated statuses (pending, confirmed, cancelled, rejected)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.MyBookingPage'
        "401":
          description: not logged in
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/booking.ErrorResponse'
      summary: List my bookings (My Bookings table)
      tags:
      - bookings
swagger: "2.0"
